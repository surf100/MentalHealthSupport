spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${PGUSER}
    password: ${PGPASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:12345678901234567890123456789012}
  expiration: 86400000

ml:
  forum-risk:
    base-url: ${AI_MODERATION_SERVICE_URL:${MENTALBERT_SERVICE_URL:http://localhost:8001}}
    analyze-path: ${AI_MODERATION_ANALYZE_PATH:${MENTALBERT_ANALYZE_PATH:/analyze}}
    connect-timeout-ms: ${AI_MODERATION_CONNECT_TIMEOUT_MS:${MENTALBERT_CONNECT_TIMEOUT_MS:3000}}
    retry-initial-delay-ms: ${AI_MODERATION_RETRY_INITIAL_DELAY_MS:${MENTALBERT_RETRY_INITIAL_DELAY_MS:15000}}
    retry-fixed-delay-ms: ${AI_MODERATION_RETRY_FIXED_DELAY_MS:${MENTALBERT_RETRY_FIXED_DELAY_MS:60000}}
